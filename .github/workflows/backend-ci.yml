name: Local workspace checks
on: [push, pull_request]
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "ai-service[test,ai]"
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest ai-service/tests -q
        env:
          AI_MODE: external
          EXECUTION_BACKEND: local
          ENVIRONMENT: development
  static-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "ai-service[dashboard]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:tracker
      - run: npm --prefix frontend run test:resume-draft
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:browser
      - run: npm --prefix landing ci
      - run: npm --prefix landing run build
